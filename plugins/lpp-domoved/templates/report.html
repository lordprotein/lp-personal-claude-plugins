<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Домовед</title>
<style>
:root {
  --bg: #f6f5f2;
  --surface: #ffffff;
  --surface-2: #f0eee9;
  --text: #1d1d1b;
  --muted: #6b6a66;
  --line: #e2dfd8;
  --accent: #2f5d50;
  --accent-soft: #e3eee9;
  --good: #2e7d4f;
  --ok: #4f7d2e;
  --warn: #b7791f;
  --bad: #c0392b;
  --good-soft: #e3f2e8;
  --ok-soft: #ecf3e2;
  --warn-soft: #fbf0dc;
  --bad-soft: #fbe5e2;
  --none: #a5a39d;
  --good-text: #2a6b45;
  --bad-text: #a3402f;
  --radar-fill: rgba(47, 93, 80, .18);
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.04);
  --radius: 14px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141513; --surface: #1c1d1b; --surface-2: #252623; --text: #ecebe6; --muted: #9c9a93;
    --line: #33342f; --accent: #7fc0a8; --accent-soft: #1f2e29;
    --good: #5cc287; --ok: #9fcb6b; --warn: #e3a948; --bad: #ef7466;
    --good-soft: #1b2e22; --ok-soft: #232c19; --warn-soft: #33281a; --bad-soft: #3a1f1c; --good-text: #8fd4a8; --bad-text: #f2a49a;
    --none: #6d6b66; --radar-fill: rgba(127, 192, 168, .2); --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141513; --surface: #1c1d1b; --surface-2: #252623; --text: #ecebe6; --muted: #9c9a93;
  --line: #33342f; --accent: #7fc0a8; --accent-soft: #1f2e29;
  --good: #5cc287; --ok: #9fcb6b; --warn: #e3a948; --bad: #ef7466;
  --good-soft: #1b2e22; --ok-soft: #232c19; --warn-soft: #33281a; --bad-soft: #3a1f1c; --good-text: #8fd4a8; --bad-text: #f2a49a;
  --none: #6d6b66; --radar-fill: rgba(127, 192, 168, .2); --shadow: none; color-scheme: dark;
}
* { box-sizing: border-box; }
html { background: var(--bg); scroll-behavior: smooth; scroll-padding-top: 64px; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased; overflow-wrap: anywhere;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
h1, h2, h3 { line-height: 1.25; margin: 0; }
h2 { font-size: 20px; margin-bottom: 14px; letter-spacing: -.01em; }
h3 { font-size: 15px; }
.wrap { max-width: 1080px; margin: 0 auto; padding: 0 16px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.num { font-variant-numeric: tabular-nums; }

.brand { font-weight: 700; letter-spacing: -.01em; font-size: 13px; color: var(--muted); }
.brand span { color: var(--accent); }
header.obj .brand { display: none; }

/* nav */
nav.top {
  position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-bottom: 1px solid var(--line);
}
nav.top .wrap { display: flex; align-items: center; gap: 12px; height: 52px; }
nav.top .brand { color: var(--text); font-size: 15px; white-space: nowrap; }
.navlinks { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; flex: 1; min-width: 0; }
.navlinks::-webkit-scrollbar { display: none; }
.navlinks a { color: var(--muted); padding: 6px 10px; border-radius: 8px; font-size: 13.5px; white-space: nowrap; }
.navlinks a:hover { background: var(--surface-2); color: var(--text); text-decoration: none; }
.navlinks a.active { color: var(--text); background: var(--surface-2); }
.pdf-btn {
  border: 1px solid var(--accent); background: var(--accent); color: var(--surface); border-radius: 8px;
  height: 34px; padding: 0 12px; cursor: pointer; font-family: inherit; font-size: 13px; font-weight: 600; flex: none; white-space: nowrap;
}
.pdf-btn:hover { filter: brightness(1.08); }
@media (max-width: 520px) { .pdf-btn { padding: 0 9px; font-size: 12px; } nav.top .brand { display: none; } }
.nav-actions { display: flex; gap: 12px; flex: none; }
/* wide screens: the menu is a sidebar on the left */
@media screen and (min-width: 1000px) {
  html { scroll-padding-top: 16px; }
  body { padding-left: 220px; }
  nav.top { position: fixed; top: 0; left: 0; bottom: 0; width: 220px; border-bottom: none; border-right: 1px solid var(--line); }
  nav.top .wrap { flex-direction: column; align-items: stretch; height: 100%; max-width: none; margin: 0; padding: 22px 14px 16px; gap: 18px; }
  nav.top .brand { font-size: 17px; padding: 0 10px; }
  .navlinks { flex-direction: column; gap: 2px; overflow-x: visible; overflow-y: auto; }
  .navlinks a { font-size: 14px; padding: 8px 10px; }
  .nav-actions { gap: 8px; }
  .nav-actions .pdf-btn { flex: 1; }
}
.theme-btn {
  border: 1px solid var(--line); background: var(--surface); color: var(--text); border-radius: 8px;
  width: 34px; height: 34px; cursor: pointer; font-size: 15px; flex: none;
}
summary.crit-head { list-style: none; cursor: pointer; }
summary.crit-head::-webkit-details-marker { display: none; }
details.crit:not([open]) > .crit-head { border-bottom: 0; }
.crit-head .chev { color: var(--muted); font-size: 12px; transition: transform .15s; }
details.crit[open] > .crit-head .chev { transform: rotate(90deg); }
.check { cursor: pointer; }
.check input { margin-top: 4px; accent-color: var(--accent); width: 16px; height: 16px; flex: none; }
.check .box { display: none; }
.check.done > span:last-child { color: var(--muted); text-decoration: line-through; }

/* header */
header.obj { padding: 28px 0 8px; }
.obj-type { display: inline-block; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--accent); margin-bottom: 6px; }
header.obj h1 { font-size: 26px; letter-spacing: -.02em; }
.facts { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 12px; color: var(--muted); font-size: 14px; }
.facts b { color: var(--text); font-weight: 600; }
.meta-line { margin-top: 10px; font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 14px; }

section { padding: 22px 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; align-items: start; }

/* hero */
.hero { display: grid; grid-template-columns: 220px 1fr; gap: 28px; align-items: start; }
.ring { position: relative; width: 200px; height: 200px; margin: 0 auto; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .val { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.ring .big { font-size: 54px; font-weight: 750; letter-spacing: -.03em; line-height: 1; }
.ring .of { color: var(--muted); font-size: 14px; margin-top: 4px; }
.verdict { display: inline-flex; align-items: center; gap: 8px; font-size: 20px; font-weight: 700; padding: 8px 14px; border-radius: 10px; }
.v-good { background: var(--good-soft); color: var(--good); }
.v-ok { background: var(--ok-soft); color: var(--ok); }
.v-warn { background: var(--warn-soft); color: var(--warn); }
.v-bad { background: var(--bad-soft); color: var(--bad); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 4px; }
.chip { font-size: 12.5px; padding: 3px 10px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }
.chip b { color: var(--text); font-weight: 600; }
.verdict-sum { margin: 10px 0 0; max-width: 70ch; font-size: 15px; line-height: 1.5; }
.alert { border-radius: 12px; padding: 12px 14px; margin-bottom: 16px; }
.alert-stop { background: var(--bad-soft); color: var(--bad); border: 1px solid color-mix(in srgb, var(--bad) 35%, transparent); }
.alert-major { background: var(--warn-soft); color: var(--warn); border: 1px solid color-mix(in srgb, var(--warn) 35%, transparent); }
.alert b { display: block; margin-bottom: 4px; }
.alert ul { margin: 0; padding-left: 18px; color: var(--text); }
.alert li { margin: 3px 0; }
.alert .detail { color: var(--muted); font-size: 13px; }
.short { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px; }
.short h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 6px; }
.list-plain { list-style: none; padding: 0; margin: 0; }
.list-plain li { padding: 4px 0 4px 22px; position: relative; }
.list-plain li::before { position: absolute; left: 0; top: 4px; font-weight: 700; }
.pros li::before { content: "+"; color: var(--good); }
.cons li::before { content: "−"; color: var(--bad); }
.checks li::before { content: "→"; color: var(--accent); }
/* pros / cons: a lightly tinted panel per side, one item per row, date and source on their own line */
.pc { border-radius: 12px; padding: 10px 14px 6px; border: 1px solid; }
.pc.good { background: color-mix(in srgb, var(--good) 6%, var(--surface)); border-color: color-mix(in srgb, var(--good) 20%, transparent); }
.pc.bad { background: color-mix(in srgb, var(--bad) 6%, var(--surface)); border-color: color-mix(in srgb, var(--bad) 20%, transparent); }
.short .pc h3, .crit-body .pc h4 { margin: 0 0 2px; }
.pc.good h3, .pc.good h4 { color: var(--good-text); }
.pc.bad h3, .pc.bad h4 { color: var(--bad-text); }
.pc .list-plain li { padding: 8px 0 8px 22px; line-height: 1.45; }
.pc .list-plain li + li { border-top: 1px solid color-mix(in srgb, var(--line) 70%, transparent); }
.pc .list-plain li::before { top: 8px; }
.pc .empty { padding: 6px 0 8px; }
.it-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.it-meta .fdate, .it-meta .src-mini { margin-left: 0; }
.chip.c-good b { color: var(--good-text); }
.chip.c-warn b { color: var(--warn); }
.chip.c-bad b { color: var(--bad-text); }
.n { font-weight: 650; font-variant-numeric: tabular-nums; white-space: nowrap; }
.detail .n, .muted .n, .s .n, .howto .n, .calc-line .n { color: var(--text); }
.calc-line { margin: 10px 0 0; font-size: 13px; color: var(--muted); }
.calc-line b { color: var(--text); font-weight: 650; }
.sum-list { margin: 10px 0 0; padding-left: 18px; max-width: 70ch; font-size: 15px; line-height: 1.5; }
.sum-list li { margin: 3px 0; }
.howto { margin-top: 14px; font-size: 13px; color: var(--muted); }
.howto > summary { cursor: pointer; color: var(--accent); font-weight: 600; }
.howto ul { margin: 6px 0 0; padding-left: 18px; }
.howto li { margin: 3px 0; }
.howto li b { color: var(--text); font-weight: 600; }
.why { background: var(--surface-2); border-radius: 12px; padding: 12px 14px; margin-top: 16px; }
.why h3 { font-size: 14px; margin-bottom: 6px; }
.why-grid { display: grid; grid-template-columns: 1fr auto; font-size: 14px; }
.why-grid > span { padding: 6px 0; border-bottom: 1px solid var(--line); }
.why-grid > span.last { border-bottom: 0; }
.why-grid .wv { font-weight: 650; white-space: nowrap; font-variant-numeric: tabular-nums; text-align: right; }
.why-grid .wv { padding-left: 12px; }
.why-grid .cmp { margin-right: 10px; }
.why-grid .total { font-weight: 600; }
.why-grid .wv.total { color: var(--bad-text); }
.why-grid .wv.total.good { color: var(--good-text); }
.cmp { font-size: 12px; font-weight: 600; padding: 1px 6px; border-radius: 6px; white-space: nowrap; }
.cmp.down { color: var(--bad-text); background: var(--bad-soft); }
.cmp.up { color: var(--good-text); background: var(--good-soft); }
.cmp.eq { color: var(--muted); background: var(--surface); }

/* criteria overview */
.overview { display: grid; grid-template-columns: minmax(260px, 380px) 1fr; gap: 24px; align-items: center; }
.radar svg { width: 100%; height: auto; display: block; overflow: visible; }
.radar text { font-size: 10.5px; fill: var(--muted); }
.crit-row { display: grid; grid-template-columns: 1fr 120px 44px 18px; gap: 10px; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--line); }
.crit-row:last-child { border-bottom: 0; }
.crit-row .name { font-size: 14px; }
.crit-row .name small { color: var(--muted); margin-left: 6px; font-size: 12px; }
.bar { height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 99px; }
.crit-row .sc { text-align: right; font-weight: 650; }
.crit-row.nodata .name, .crit-row.nodata .sc { color: var(--none); }
.conf { width: 10px; height: 10px; border-radius: 50%; display: inline-block; border: 2px solid var(--muted); }
.conf-high { background: var(--muted); }
.conf-medium { background: linear-gradient(90deg, var(--muted) 50%, transparent 50%); }
.conf-low { background: transparent; }
.conf-none { border-style: dashed; border-color: var(--none); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 10px; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }

/* criterion cards */
.crit { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 10px; }
.crit > .crit-head { padding: 14px 16px; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: 28px 1fr auto 14px; gap: 10px; align-items: center; }
.crit > .crit-head .ic { font-size: 18px; }
.crit > .crit-head .t { font-weight: 600; }
.crit > .crit-head .s1 { color: var(--muted); font-size: 13px; display: block; font-weight: 400; margin-top: 2px; }
.pill { font-weight: 700; font-size: 14px; padding: 3px 10px; border-radius: 8px; min-width: 46px; text-align: center; }
.crit-body { padding: 14px 16px 16px 54px; }
.crit-body .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin: 10px 0; }
.crit-body h4 { margin: 12px 0 4px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.ev { font-size: 13.5px; margin: 0; padding-left: 18px; }
.ev li { margin: 3px 0; }

/* price */
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.kpi { background: var(--surface-2); border-radius: 12px; padding: 12px 14px; }
.kpi .l { font-size: 12px; color: var(--muted); }
.kpi .v { font-size: 20px; font-weight: 700; margin-top: 2px; letter-spacing: -.01em; }
.kpi .v.bad { color: var(--bad); } .kpi .v.good { color: var(--good); }
.scale { position: relative; height: 64px; margin: 22px 6px 8px; }
.scale .track { position: absolute; left: 0; right: 0; top: 28px; height: 8px; border-radius: 99px; background: var(--surface-2); }
.scale .range { position: absolute; top: 28px; height: 8px; border-radius: 99px; background: color-mix(in srgb, var(--good) 45%, transparent); }
.scale .mark { position: absolute; top: 18px; width: 2px; height: 28px; transform: translateX(-1px); }
.scale .mark .lab { position: absolute; top: -18px; left: 50%; transform: translateX(-50%); font-size: 12px; white-space: nowrap; font-weight: 600; }
.scale .mark.ask { background: var(--text); }
.scale .mark.fair { background: var(--good); }
.scale .mark.fair .lab { top: 32px; color: var(--good); }
.scale .ends { position: absolute; top: 44px; left: 0; right: 0; display: flex; justify-content: space-between; font-size: 11.5px; color: var(--muted); }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th, td { text-align: left; padding: 8px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 500; font-size: 12.5px; }
td.r, th.r { text-align: right; }
th, td { overflow-wrap: normal; }
table.cmp td:first-child { min-width: 130px; }
table.cmp th, table.cmp td { min-width: 140px; }
.table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.tag { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 6px; background: var(--surface-2); color: var(--muted); margin: 2px 4px 2px 0; }
.tag.bad { background: var(--bad-soft); color: var(--bad); }
.tag.good { background: var(--good-soft); color: var(--good); }
.tag.warn { background: var(--warn-soft); color: var(--warn); }
.meter { height: 10px; background: var(--surface-2); border-radius: 99px; position: relative; margin: 8px 0 4px; }
.meter > i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 99px; }
.meter > b { position: absolute; top: -4px; width: 2px; height: 18px; background: var(--text); }

/* future */
.timeline { position: relative; padding-left: 22px; }
.timeline::before { content: ""; position: absolute; left: 6px; top: 6px; bottom: 6px; width: 2px; background: var(--line); }
.tl { position: relative; padding: 0 0 16px; }
.tl::before { content: ""; position: absolute; left: -21px; top: 6px; width: 12px; height: 12px; border-radius: 50%; background: var(--surface); border: 2px solid var(--accent); }
.tl.threat::before { border-color: var(--bad); }
.tl .h { font-weight: 600; }
.tl .m { font-size: 13px; color: var(--muted); margin-top: 2px; }
.st { font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 6px; margin-right: 6px; white-space: nowrap; }
.st-built { background: var(--good-soft); color: var(--good); }
.st-under_construction { background: var(--ok-soft); color: var(--ok); }
.st-aip { background: var(--accent-soft); color: var(--accent); }
.st-plan { background: var(--warn-soft); color: var(--warn); }
.st-announced, .st-rumor { background: var(--surface-2); color: var(--muted); }
.scen { display: grid; grid-template-columns: 60px 1fr; gap: 10px; align-items: center; margin: 10px 0; }
.scen .bars { position: relative; height: 34px; background: var(--surface-2); border-radius: 8px; }
.scen .zero { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--muted); opacity: .5; }
.scen .seg { position: absolute; top: 9px; height: 16px; border-radius: 4px; background: color-mix(in srgb, var(--accent) 30%, transparent); }
.scen .pt { position: absolute; top: 4px; width: 3px; height: 26px; border-radius: 2px; background: var(--accent); transform: translateX(-1px); }
.scen .labs { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: 3px; }
.disclaimer { font-size: 12.5px; color: var(--muted); border-left: 3px solid var(--line); padding: 4px 0 4px 12px; margin-top: 14px; }

/* yields */
.yrow { display: grid; grid-template-columns: 150px 1fr 60px; gap: 10px; align-items: center; margin: 8px 0; font-size: 14px; }
.yrow .bar { height: 12px; }

/* geo */
.geo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.geo-cat { background: var(--surface-2); border-radius: 12px; padding: 12px 14px; }
.geo-cat h3 { font-size: 13px; color: var(--muted); font-weight: 600; margin-bottom: 6px; display: flex; justify-content: space-between; }
.geo-cat ul { list-style: none; margin: 0; padding: 0; font-size: 13.5px; }
.geo-cat li { display: flex; justify-content: space-between; gap: 8px; padding: 2px 0; }
.geo-cat li span:last-child { color: var(--muted); white-space: nowrap; }
.geo-cat.neg h3 { color: var(--bad); }
.btns { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { display: inline-block; border: 1px solid var(--line); background: var(--surface); padding: 7px 12px; border-radius: 8px; font-size: 13.5px; color: var(--text); }
.btn:hover { text-decoration: none; background: var(--surface-2); }

/* reviews */
.rev { padding: 10px 0; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: 10px 1fr; gap: 10px; }
.rev:last-child { border-bottom: 0; }
.rev .dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 6px; }
.dot.pos { background: var(--good); } .dot.neg { background: var(--bad); } .dot.neu { background: var(--none); }
.rev .src { font-size: 12.5px; color: var(--muted); margin-top: 2px; }

/* checklists */
.check { display: flex; gap: 10px; align-items: flex-start; padding: 5px 0; }
.check .box { flex: none; width: 14px; height: 14px; margin-top: 4px; border: 1.5px solid var(--muted); border-radius: 3px; }
.check-cols { columns: 2; column-gap: 28px; }
.check-cols .check { break-inside: avoid; }
@media (max-width: 700px) { .check-cols { columns: 1; } }
.progress { font-size: 12.5px; color: var(--muted); font-weight: 500; white-space: nowrap; }

footer { padding: 30px 0 50px; color: var(--muted); font-size: 12.5px; }
.empty { color: var(--muted); font-size: 14px; font-style: italic; }

@media (max-width: 860px) {
  .hero, .overview, .grid2, .short { grid-template-columns: 1fr; }
  .grid3 { grid-template-columns: 1fr; }
  .kpis { grid-template-columns: 1fr 1fr; }
  .radar { max-width: 360px; margin: 0 auto; }
}
@media (max-width: 520px) {
  header.obj h1 { font-size: 21px; }
  .card { padding: 16px; }
  .ring { width: 170px; height: 170px; }
  .ring .big { font-size: 46px; }
  .crit-row { grid-template-columns: 1fr 70px 38px 14px; gap: 8px; }

      landfill: 3000, waste: 500, fuel: 100, nightlife: 100, construction: 200, cemetery: 300, prison: 500, psychiatric: 300, aerodrome: 5000 };
    var GROUPS = [
      ["Транспорт", "🚉", ["metro", "rail_station", "stop_bus_tram"], false],
      ["Дети", "🎒", ["school", "kindergarten", "playground", "university"], false],
      ["Отдых", "🌿", ["park", "forest", "water", "sport"], false],
      ["Быт", "🏪", ["grocery", "pharmacy", "clinic", "hospital", "mall"], false],
      ["Что может мешать", "⚠️", ["major_road", "railway_line", "tram_line", "industrial", "substation", "powerline", "power_plant", "landfill", "waste", "fuel", "nightlife", "construction", "cemetery", "prison", "psychiatric", "aerodrome", "minor_road"], true]
    ];
    function osmUrl(it) { return safeUrl(it.url) || (it.osm ? "https://www.openstreetmap.org/" + it.osm : null); }
    function within(k, r) {
      var c = (G.counts || {})[k];
      if (c && typeof c === "object") return isNum(c[String(r)]) ? c[String(r)] : null;
      return arr(cats[k]).filter(function (x) { return isNum(x.distance_m) && x.distance_m <= r; }).length;
    }
    var FORMS = { stop_bus_tram: ["остановка", "остановки", "остановок"], metro: ["вход", "входа", "входов"], rail_station: ["станция", "станции", "станций"],
      school: ["корпус", "корпуса", "корпусов"], kindergarten: ["корпус", "корпуса", "корпусов"], park: ["участок", "участка", "участков"] };
    function plural(n, k) {
      var f = FORMS[k] || ["объект", "объекта", "объектов"], m10 = n % 10, m100 = n % 100;
      var w = (m10 === 1 && m100 !== 11) ? f[0] : (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) ? f[1] : f[2];
      return n + " " + w;
    }
    function catRow(k, neg) {
      var list = arr(cats[k]).filter(function (x) { return isNum(x.distance_m); }).sort(function (a, b) { return a.distance_m - b.distance_m; });
      if (!list.length) return null;
      var m = GEO[k] || [k, "•", "Объект", "объектов"];
      var first = list[0];
      // collapse identical names

      list.forEach(function (x) { var n = x.name || ""; if (!byName[n]) { byName[n] = []; order.push(n); } byName[n].push(x); });
      var nm = first.name || m[2];
      var same = byName[first.name || ""].length;
      var url = osmUrl(first);
      var extra = [];
      order.filter(function (n) { return n && n !== (first.name || ""); }).slice(0, 2).forEach(function (n) { extra.push(n + " (" + meters(byName[n][0].distance_m) + ")"); });
      var n1k = within(k, 1000);
      var more = isNum(n1k) && n1k > 1 && ["substation", "minor_road", "powerline"].indexOf(k) < 0 ? "всего в 1 км: " + n1k : null;
      var ex = [extra.length ? "также: " + extra.join(", ") : null, more].filter(Boolean).join(" · ");
      var near = neg && NEAR[k] && first.distance_m <= NEAR[k];
      return h("div", { class: "env-row" },
        h("span", { class: "ei", text: m[1] }),
        h("div", null, h("div", { class: "el", text: m[0] }),
          h("div", { class: "en" }, url ? h("a", { href: url, target: "_blank", rel: "noopener noreferrer", text: nm, style: "color:inherit" }) : nm,
            first.name && same > 1 ? h("span", { class: "muted small", text: ", " + plural(same, k) }) : null),
          ex ? h("div", { class: "ex", text: ex }) : null),
        h("span", { class: "ed num" + (near ? " near" : ""), text: meters(first.distance_m) }));
    }

    var lat = isNum(O.lat) ? O.lat : (G.center || {}).lat, lon = isNum(O.lon) ? O.lon : (G.center || {}).lon;
    var card = h("div", { class: "card" });
    if (isNum(lat) && isNum(lon)) {
      var bt = h("div", { class: "btns", style: "margin-bottom:14px" },
        link("https://yandex.ru/maps/?pt=" + lon + "," + lat + "&z=16&l=map", "📍 Яндекс Карты ↗"),
        link("https://2gis.ru/geo/" + lon + "," + lat, "📍 2ГИС ↗"),
        link("https://www.openstreetmap.org/?mlat=" + lat + "&mlon=" + lon + "#map=16/" + lat + "/" + lon, "📍 OpenStreetMap ↗"));
      var bb = bt.querySelectorAll("a"); for (var b = 0; b < bb.length; b++) bb[b].className = "btn";
      card.appendChild(bt);
    }

    var partial = geoPartial();

    var groupsEl = h("div", { class: "env-groups" });
    GROUPS.forEach(function (g) {
      var rows = g[2].map(function (k) { return catRow(k, g[3]); }).filter(Boolean);
      if (!rows.length && !g[3]) return;
      var box = h("div", { class: "env-group" + (g[3] ? " neg" : "") }, h("h3", null, h("span", { text: g[1] }), h("span", { text: g[0] })));
      if (rows.length) { var holder = g[3] ? h("div", { class: "env-cols" }) : box; rows.forEach(function (r) { holder.appendChild(r); }); if (g[3]) box.appendChild(holder); }
      else box.appendChild(h("div", { class: "env-ok", text: "✓ Рядом ничего мешающего не найдено" + (partial ? " (кроме неучтённых дорог)" : "") }));
      groupsEl.appendChild(box);
    });
    card.appendChild(groupsEl);
    card.appendChild(h("div", { class: "small muted", style: "margin-top:12px", text: "Расстояния по прямой по данным OpenStreetMap" + (isNum(G.radius_m) ? ", радиус поиска " + meters(G.radius_m) : "") + ". Красным отмечено то, что слишком близко. Названия кликабельны: откроется объект на карте." }));
    addSection("geo", "Окружение", sectionCard("geo", "Что рядом", card));
  })();

  // ---------- reviews ----------
  (function () {
    var hs = arr(R.house), ds = arr(R.district), site = R.site && typeof R.site === "object" ? R.site : null;
    if (!hs.length && !ds.length && !R.house_summary && !R.district_summary && !site && !arr(R.house_points).length && !arr(R.district_points).length) return;
    var SITE = { avito: "Авито", cian: "ЦИАН", domclick: "Домклик", yandex_realty: "Яндекс Недвижимость", yandex_maps: "Яндекс Карты", "2gis": "2ГИС" };
    function col(title, points, summary, list, siteInfo) {
      var pos = list.filter(function (r) { return r.sentiment === "pos"; }).length, neg = list.filter(function (r) { return r.sentiment === "neg"; }).length;
      var siteEl = null;
      if (siteInfo && (isNum(siteInfo.rating) || isNum(siteInfo.count) || siteInfo.url)) {
        var nm = SITE[siteInfo.site] || siteInfo.site || hostOf(siteInfo.url || "");
        siteEl = h("div", { class: "keybox", style: "margin:8px 0" },
          h("div", { class: "l", text: "Рейтинг дома на " + nm }),
          h("div", { class: "v num" }, isNum(siteInfo.rating) ? "★ " + dec(siteInfo.rating, 1) : "н/д", isNum(siteInfo.count) ? h("span", { class: "muted small", style: "font-weight:500", text: " · " + siteInfo.count + " отзывов" }) : null),
          siteInfo.url ? h("div", { class: "s" }, srcChip(siteInfo.url, "открыть отзывы на " + nm)) : null,
          siteInfo.blocked ? h("div", { class: "s", text: "Тексты отзывов не загрузились: откройте страницу сами." }) : null);
      }
      return h("div", { class: "card" },
        h("h3", null, title, list.length ? h("span", { class: "muted small", style: "font-weight:400;margin-left:8px", text: "👍 " + pos + " · 👎 " + neg }) : null),
        siteEl,
        pointsEl(points, summary, null, 5),
        list.length ? h("div", { style: "margin-top:6px" }, list.map(function (r) {
          var rd = factDate(r.date);
          return h("div", { class: "rev rev-" + (r.sentiment || "neu") + (rd && rd.cls === "old" ? " is-old" : "") }, h("span", { class: "dot " + (r.sentiment || "neu") }),
            h("div", null, h("div", { class: "rt" }, rich(deJargon(r.text || ""))),
              h("div", { class: "src" }, [topicRu(r.topic) ? h("span", { class: "tag", text: topicRu(r.topic) }) : null, r.url ? srcChip(r.url, r.source || hostOf(r.url)) : (r.source || ""), rd ? rd.el : (r.date ? " · " + r.date : "")])));
        })) : (siteEl ? null : h("div", { class: "empty", text: "Отзывов не найдено" })));
    }
    var lg = hs.concat(ds).some(function (r) { return !!factDate(r.date); }) ? dateLegend() : null;
    if (lg) lg.style.margin = "0 0 10px";
    addSection("reviews", "Отзывы", sectionCard("reviews", "Отзывы", [lg, h("div", { class: "grid2" },
      col("О доме", R.house_points, R.house_summary, hs, site), col("О районе", R.district_points, R.district_summary, ds, null))], "пересказ, ссылки на источники"));
  })();

  // ---------- checklists ----------
  (function () {
    var groups = [["documents", "Документы, которые нужно запросить"], ["questions_to_seller", "Вопросы продавцу"], ["viewing", "Проверить на просмотре"]];
    var extra = [];
    var seenV = {};
    arr(K.viewing).forEach(function (t) { seenV[String(t).toLowerCase()] = 1; });
    CRIT_ORDER.forEach(function (k) { arr((C[k] || {}).check_in_person).forEach(function (t) {
      var key = String(t).toLowerCase(); if (seenV[key]) return; seenV[key] = 1;
      extra.push((SHORT[k] || "") + ": " + lcFirst(deJargon(t)));
    }); });
    var lists = {};
    groups.forEach(function (g) { lists[g[0]] = arr(K[g[0]]).slice(); });
    lists.viewing = lists.viewing.concat(extra);
    if (!lists.documents.length && !lists.questions_to_seller.length && !lists.viewing.length) return;
    var storeKey = "domoved:" + (O.listing_url || O.address || "obj");
    var state = {};
    try { state = JSON.parse(localStorage.getItem(storeKey) || "{}") || {}; } catch (e) { state = {}; }
    function save() { try { localStorage.setItem(storeKey, JSON.stringify(state)); } catch (e) { /* storage unavailable */ } }
    var grid = h("div");
    var top = h("div", { class: "grid2" });
    groups.forEach(function (g) {
      var items = lists[g[0]]; if (!items.length) return;
      var wide = g[0] === "viewing";
      var prog = h("span", { class: "progress" });
      function upd() { var d = items.filter(function (_, i) { return state[g[0] + ":" + i]; }).length; prog.textContent = d + " из " + items.length; }
      var box = h("div", { class: "card" + (wide ? " check-wide" : ""), style: wide ? "margin-top:16px" : null },
        h("h3", { style: "display:flex;justify-content:space-between;gap:8px;margin-bottom:8px" }, h("span", { text: g[1] }), prog));
      var listEl = h("div", { class: wide ? "check-cols" : null });
      items.forEach(function (t, i) {
        var id = g[0] + ":" + i;
        var cb = h("input", { type: "checkbox" }); cb.checked = !!state[id];
        var lab = h("label", { class: "check" + (cb.checked ? " done" : "") }, cb, h("span", { class: "box", text: "" }), h("span", { text: deJargon(t) }));
        cb.addEventListener("change", function () { state[id] = cb.checked; lab.className = "check" + (cb.checked ? " done" : ""); save(); upd(); });
        listEl.appendChild(lab);

      upd();
      box.appendChild(listEl);
      (wide ? grid : top).appendChild(box);
    });
    if (top.childNodes.length) grid.insertBefore(top, grid.firstChild);
    addSection("checklists", "Чеклисты", sectionCard("checklists", "Чеклисты перед сделкой", grid, "отметки сохраняются в этом браузере"));
  })();

  // ---------- sources & footer ----------
  (function () {
    var src = arr(D.sources);
    var gaps = arr((D.meta || {}).data_gaps);
    if (src.length || gaps.length) {
      var card = h("div", { class: "card" });
      if (gaps.length) card.appendChild(h("div", { style: "margin-bottom:12px" }, h("h3", { style: "margin-bottom:6px", text: "Пробелы в данных" }), h("ul", { class: "ev muted" }, gaps.map(function (g) { return h("li", { text: g }); }))));
      if (src.length) card.appendChild(h("div", null, h("h3", { style: "margin-bottom:6px", text: "Источники" }),
        h("ul", { class: "ev" }, src.map(function (s) { return h("li", null, link(s.url, s.title || hostOf(s.url)) || (s.title || "")); }))));
      addSection("sources", "Источники", sectionCard("sources", "Источники", card));
    }
    document.getElementById("footer").appendChild(h("div", null,
      h("p", { text: "Отчёт Домоведа носит информационный характер. Он не является индивидуальной инвестиционной рекомендацией, юридической консультацией или отчётом об оценке по 135-ФЗ. Перед сделкой проверьте документы с юристом и закажите выписки ЕГРН." }),
      h("p", { text: "Расстояния: OpenStreetMap. Поправки и эффекты: российская оценочная практика и зарубежные исследования (см. методику плагина)." })));
  })();


  // ---------- nav ----------
  (function () {
    var nl = document.getElementById("navlinks");
    var links = navItems.map(function (n) { var el = h("a", { href: "#" + n[0], text: n[1] }); nl.appendChild(el); return el; });
    if ("IntersectionObserver" in window) {
      var obs = new IntersectionObserver(function (es) {
        es.forEach(function (e) {
          if (!e.isIntersecting) return;
          links.forEach(function (a) { a.classList.toggle("active", a.getAttribute("href") === "#" + e.target.id); });
        });
      }, { rootMargin: "-40% 0px -55% 0px" });
      navItems.forEach(function (n) { var el = document.getElementById(n[0]); if (el) obs.observe(el); });
    }
    function openHash() {
      if (location.hash === "#print") { openAll(); return; }
      var t = location.hash && document.getElementById(location.hash.slice(1)); if (t && t.tagName === "DETAILS") t.open = true;
    }
    window.addEventListener("hashchange", openHash); openHash();
  })();

})();
